<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlay EVO</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:#fff}.root{position:fixed;inset:0;pointer-events:none}.hud{position:absolute;left:18px;top:18px;display:grid;gap:9px}.glass{background:rgba(2,9,25,.62);border:1px solid rgba(0,217,255,.32);backdrop-filter:blur(16px);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.28),0 0 25px rgba(0,217,255,.1)}.brand{padding:11px 14px;font-weight:1000;letter-spacing:.08em}.brand b{color:#00d9ff}.stats{display:flex;gap:8px;padding:9px}.stat{min-width:84px;padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.04)}.stat small{display:block;color:#9cc7ef;font-size:9px}.stat b{font-size:18px}.feed{position:absolute;right:18px;top:18px;width:min(340px,34vw);padding:12px}.feed h4{margin:0 0 8px;color:#9edfff;letter-spacing:.12em;font-size:11px}.feedItem{padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.035);margin-top:6px}.feedItem small{display:block;color:#9bbce0;margin-top:2px}.scene{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(780px,88vw);height:330px;display:grid;place-items:center}.alert{position:absolute;width:min(660px,88vw);padding:16px 18px;display:grid;grid-template-columns:84px 1fr;gap:15px;align-items:center;opacity:0;transform:translateY(22px) scale(.94);transition:.24s;border:1px solid rgba(255,255,255,.18);border-radius:22px;background:linear-gradient(135deg,rgba(4,15,39,.88),rgba(7,12,31,.75));backdrop-filter:blur(18px);box-shadow:0 20px 65px rgba(0,0,0,.4),0 0 40px rgba(0,217,255,.2)}.alert.show{opacity:1;transform:none}.avatar{width:84px;height:84px;display:grid;place-items:center;overflow:hidden;border-radius:18px;background:radial-gradient(circle,rgba(0,217,255,.22),transparent 70%)}.avatar img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(0,217,255,.35));animation:charPop 3s ease both}.alert h2{margin:0;font-size:25px}.alert p{margin:5px 0 0;color:#c5dcf7}.kind{font-size:10px;letter-spacing:.14em;color:#8fdcff;margin-bottom:5px}.fx{position:absolute;inset:0;overflow:hidden}.particle{position:absolute;font-size:34px;opacity:0;animation:rise 3s ease-out forwards;filter:drop-shadow(0 0 12px rgba(0,217,255,.4))}.portal{position:absolute;width:220px;height:220px;border:16px solid #7d42ff;border-radius:36%;opacity:0;box-shadow:0 0 45px #7d42ff,inset 0 0 45px #00d9ff;animation:portal 3s ease both}.creeperFlash{position:absolute;inset:0;background:radial-gradient(circle,rgba(68,255,80,.35),transparent 45%);opacity:0;animation:flash 3s ease both}.tnt{position:absolute;font-size:90px;opacity:0;animation:tnt 3s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{0%{transform:translateY(140px) scale(.5) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(-260px) scale(1.2) rotate(24deg);opacity:0}}@keyframes charPop{0%{transform:translateX(-80px) rotate(-12deg) scale(.6);opacity:0}18%{transform:translateX(0) rotate(2deg) scale(1.1);opacity:1}82%{opacity:1}100%{transform:translateX(45px) scale(.8);opacity:0}}@keyframes portal{0%{transform:scale(.15) rotate(0);opacity:0}20%{opacity:.9}75%{opacity:.8}100%{transform:scale(1.45) rotate(120deg);opacity:0}}@keyframes flash{0%,12%,30%,100%{opacity:0}18%,25%{opacity:1}}@keyframes tnt{0%{transform:translateY(-220px) rotate(-35deg) scale(.3);opacity:0}22%{opacity:1;transform:translateY(0) rotate(5deg) scale(1)}70%{opacity:1;transform:scale(1.12)}100%{transform:scale(2);opacity:0}}.vertical .feed{width:48vw}.vertical .stats{flex-wrap:wrap}.vertical .scene{top:58%;height:420px}</style><script src="/community.js"></script></head><body><div id="root" class="root"><div class="hud"><div class="glass brand">♕ LULUDA<b>MOBILETE</b> • OVERLAY EVO</div><div class="glass stats"><div class="stat"><small>ONLINE</small><b id="online">0</b></div><div class="stat"><small>VISITAS</small><b id="visits">0</b></div><div class="stat"><small>REAÇÕES</small><b id="reacts">0</b></div></div></div><div class="glass feed"><h4>EVENTOS REGISTRADOS</h4><div id="feed"></div></div><div class="scene"><div id="fx" class="fx"></div><div id="alert" class="alert"><div id="avatar" class="avatar">✨</div><div><div id="kind" class="kind">SISTEMA</div><h2 id="title">Overlay conectado</h2><p id="sub">Aguardando a Família EVO.</p></div></div></div></div><script>(function(){var root=document.getElementById("root"),fx=document.getElementById("fx"),al=document.getElementById("alert"),av=document.getElementById("avatar"),ti=document.getElementById("title"),su=document.getElementById("sub"),ki=document.getElementById("kind"),q=[],busy=false;root.classList.toggle("vertical",new URLSearchParams(location.search).get("mode")==="vertical");var assets={hype:"/assets/emote-hype.webp",heart:"/assets/emote-heart.webp",crown:"/assets/emote-crown.webp",surprise:"/assets/emote-surprise.webp"},idle=[{kind:"diamond",text:"Diamante encontrado!",icon:"💎",scene:"diamond"},{kind:"creeper",text:"Creeper por perto!",icon:"🟩",scene:"creeper"},{kind:"portal",text:"Portal EVO aberto",icon:"🟪",scene:"portal"},{kind:"tnt",text:"TNT na área!",icon:"🧨",scene:"tnt"},{kind:"mining",text:"Combo de mineração!",icon:"⛏️",scene:"mining"}];function esc(s){return String(s||"").replace(/[&<>"']/g,function(m){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]})}function total(r){return(r.hype||0)+(r.heart||0)+(r.crown||0)+(r.surprise||0)}function draw(st){document.getElementById("online").textContent=st.online||0;document.getElementById("visits").textContent=st.interactions?.visits||0;document.getElementById("reacts").textContent=total(st.interactions?.reactions||{});document.getElementById("feed").innerHTML=(st.interactions?.lastEvents||[]).slice(0,5).map(function(x){return'<div class="feedItem"><b>'+(x.icon||"✨")+' '+esc(x.text)+'</b><small>'+esc(x.from||"Família EVO")+'</small></div>'}).join("")||'<div class="feedItem"><b>Overlay pronto</b><small>Eventos aparecerão aqui.</small></div>'}function particle(icon,n){for(let i=0;i<n;i++)setTimeout(function(){var x=document.createElement("div");x.className="particle";x.textContent=icon;x.style.left=(8+Math.random()*84)+"%";x.style.bottom=(-20+Math.random()*50)+"px";fx.appendChild(x);setTimeout(function(){x.remove()},3300)},i*65)}function scene(e){fx.innerHTML="";var s=e.scene||e.kind;if(s==="portal"){var p=document.createElement("div");p.className="portal";fx.appendChild(p);particle("✨",8)}else if(s==="creeper"){var c=document.createElement("div");c.className="creeperFlash";fx.appendChild(c);particle("🟩",7)}else if(s==="tnt"){var t=document.createElement("div");t.className="tnt";t.textContent="🧨";fx.appendChild(t);particle("💥",8)}else if(s==="diamond")particle("💎",14);else if(s==="mining"||s==="score"){particle("⛏️",8);particle("🧱",7)}else if(s==="crown"||s==="winner")particle("👑",10);else particle(e.icon||"✨",8)}function show(e){busy=true;var a=assets[e.scene]||assets[e.reaction]||assets[e.kind];av.innerHTML=a?'<img src="'+a+'" alt="">':(e.icon||"✨");ki.textContent=String(e.kind||"EVENTO").toUpperCase();ti.textContent=e.text||"Novo evento";su.textContent=(e.from||"Família EVO")+" • animação automática de 3 segundos";scene(e);al.classList.add("show");setTimeout(function(){al.classList.remove("show")},2600);setTimeout(function(){busy=false;drain()},3000)}function drain(){if(!busy&&q.length)show(q.shift())}function push(e){q.push(e);if(q.length>12)q.shift();drain()}setInterval(function(){if(!busy&&!q.length)push(idle[Math.floor(Math.random()*idle.length)])},12000);if(window.LuluCommunity){LuluCommunity.connect("");LuluCommunity.subscribe(draw);LuluCommunity.onEvent(function(d){if(d.type==="overlay_event"&&d.event)push(d.event);else if(d.type==="race_winner")push({kind:"winner",text:d.name+" venceu!",from:"Corrida EVO",icon:"🏆",scene:"crown"});else if(d.type==="music_added")push({kind:"music",text:d.song.title,from:d.song.requestedBy,icon:"♫",scene:"portal"})});setTimeout(function(){LuluCommunity.trackPage("/overlay.html")},700)}})();</script></body></html>
